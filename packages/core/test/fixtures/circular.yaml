openapi: 3.0.3
info: { title: Circular, version: 1.0.0 }
components:
  schemas:
    Node:
      type: object
      required: [id]
      properties:
        id: { type: integer }
        children:
          type: array
          items: { $ref: "#/components/schemas/Node" }
    TreeResponse:
      type: object
      properties:
        root: { $ref: "#/components/schemas/Node" }
        count: { type: integer }
paths:
  /tree:
    get:
      operationId: getTree
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TreeResponse" }
